name: Deploy MC Manage

on:
  push:
    branches:
      - deploy

jobs:
  deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun.js
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.0.0
          cache: bun
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: bun install

      - name: Create .env file
        working-directory: frontend
        run: |
          echo "VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}" >> .env
          echo "VITE_WS_BASE_URL=${{ vars.VITE_WS_BASE_URL }}" >> .env

      - name: Build
        working-directory: frontend
        run: bun run build

      - name: Deploy frontend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ vars.VPS_PORT || 22 }}
          source: frontend/dist/*
          target: /tmp/mc-manage-frontend/
          strip_components: 2

      - name: Publish frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ vars.VPS_PORT || 22 }}
          script: |
            set -e
            sudo mkdir -p /var/www/${{ vars.DOMAIN_NAME }}
            sudo rsync -av --delete /tmp/mc-manage-frontend/ /var/www/${{ vars.DOMAIN_NAME }}/
            sudo chown -R www-data:www-data /var/www/${{ vars.DOMAIN_NAME }}
            sudo chmod -R 755 /var/www/${{ vars.DOMAIN_NAME }}
            rm -rf /tmp/mc-manage-frontend

  deploy-backend:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build binary (Linux amd64)
        working-directory: backend
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o mc-manage-backend main.go

      - name: Upload binary to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ vars.VPS_PORT || 22 }}
          source: backend/mc-manage-backend
          target: /tmp/mc-manage/
          strip_components: 1

      - name: Install & restart backend service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ vars.VPS_PORT || 22 }}
          script: |
            set -e

            INSTALL_DIR="/opt/mc-manage/backend"
            SERVICE_NAME="mc-manage"
            BIN_NAME="mc-manage-backend"

            sudo mkdir -p "$INSTALL_DIR"
            sudo chown ${{ vars.VPS_USER }}:${{ vars.VPS_USER }} "$INSTALL_DIR"

            sudo tee "$INSTALL_DIR/.env" <<EOF > /dev/null
            ADMIN_USERNAME=${{ vars.ADMIN_USERNAME || 'admin' }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            PORT=${{ vars.BACKEND_PORT || '8080' }}
            DEBUG_MODE=${{ vars.DEBUG_MODE || 'false' }}
            MONGO_DB_NAME=${{ vars.MONGO_DB_NAME || 'mc-manage' }}
            MONGO_URI=${{ secrets.MONGO_URI }}
            EOF
            sudo chmod 600 "$INSTALL_DIR/.env"
            sudo chown root:root "$INSTALL_DIR/.env"

            sudo systemctl stop "$SERVICE_NAME" || true

            sudo mv /tmp/mc-manage/"$BIN_NAME" "$INSTALL_DIR/$BIN_NAME"
            sudo chmod +x "$INSTALL_DIR/$BIN_NAME"
            sudo chown root:root "$INSTALL_DIR/$BIN_NAME"

            if [ ! -f /etc/systemd/system/"$SERVICE_NAME".service ]; then
              sudo tee /etc/systemd/system/"$SERVICE_NAME".service <<'EOF' > /dev/null
            [Unit]
            Description=MC Manage Backend Service
            After=network.target

            [Service]
            Type=simple
            User=root
            WorkingDirectory=/opt/mc-manage/backend
            ExecStart=/opt/mc-manage/backend/mc-manage-backend
            Restart=always
            RestartSec=5
            Environment=PORT=${{ vars.BACKEND_PORT || '8080' }}

            [Install]
            WantedBy=multi-user.target
            EOF
              sudo systemctl daemon-reload
              sudo systemctl enable "$SERVICE_NAME"
            fi

            sudo systemctl start "$SERVICE_NAME"
            sudo systemctl is-active --quiet "$SERVICE_NAME" && echo "Service started successfully" || (sudo journalctl -u "$SERVICE_NAME" -n 20 && exit 1)
